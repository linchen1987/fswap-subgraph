version: '3'
services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:14 # 你可以选择合适的 PostgreSQL 版本
    container_name: local_postgres
    volumes:
      - ./.data/postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: password # 使用强密码替换
      POSTGRES_DB: graph-node
      # LC_ALL: C
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - '5432:5432' # 可选，如果需要从主机直接访问 DB
    restart: unless-stopped

  # IPFS 节点
  ipfs:
    image: ipfs/go-ipfs:v0.12.0 # 选择一个合适的 IPFS 版本
    container_name: local_ipfs
    volumes:
      - ./.data/ipfs_data:/data/ipfs
    ports:
      - '5001:5001' # API 端口
      - '8080:8080' # Gateway 端口
    restart: unless-stopped

  # Graph Node
  graph-node:
    image: graphprotocol/graph-node:latest # 或者指定一个稳定版本，如 v0.30.0
    container_name: local_graph_node
    ports:
      - '8000:8000' # GraphQL HTTP 查询端口
      - '8001:8001' # GraphQL WS 查询端口 (如果需要)
      - '8020:8020' # JSON RPC 管理端口 (用于部署)
      - '8030:8030' # Prometheus 指标端口 (可选)
      - '8040:8040' # Subgraph 元数据端口 (可选)
    depends_on:
      - postgres
      - ipfs
    environment:
      postgres_host: postgres # Docker Compose 服务名
      postgres_user: graph-node
      postgres_pass: password # 与上面设置的密码一致
      postgres_db: graph-node
      ipfs: 'ipfs:5001' # Docker Compose 服务名和 API 端口
      # 重要：设置 Ethereum 节点 RPC 地址
      # 如果你在主机上运行 Ganache (默认 http://127.0.0.1:8545)
      # 使用 host.docker.internal 让容器可以访问主机服务 (Docker Desktop on Mac/Win)
      # 对于 Linux，可能需要用 '172.17.0.1' (默认 Docker bridge IP) 或设置自定义网络
      # ethereum: 'mainnet:http://host.docker.internal:8545' # 'mainnet' 是网络名，可以自定义
      # ethereum: 'coston:https://coston-api.flare.network/ext/C/rpc' # 'mainnet' 是网络名，可以自定义
      ethereum: 'coston2:https://coston2-api.flare.network/ext/C/rpc' # 'mainnet' 是网络名，可以自定义
      # 如果使用 Hardhat Node，类似地指向其 RPC 地址
      # ethereum: 'dev:http://host.docker.internal:8545'
      # 你可以添加多个网络，用逗号分隔，例如：
      # ethereum: 'mainnet:http://host.docker.internal:8545,goerli:https://goerli.infura.io/v3/YOUR_INFURA_ID'
    volumes:
      - ./.data/graph_node_data:/var/lib/graph-node/data
    restart: unless-stopped

