type CollateralReservedEvent @entity(immutable: true) {
  # id is the collateralReservationId
  id: ID!
  txHash: String!
  minter: String!
}

type FAssetEvent @entity(immutable: true) {
  # id is the txHash
  id: ID!
  user: String!
  # mint, redeem
  type: String!
  # MintingExecuted, RedemptionPerformed, RedemptionDefault
  status: String!
  collateralReservationId: BigInt
  redeemRequestId: BigInt
  redeemUnderlyingTxHash: String
  created: BigInt!
  updated: BigInt!
}
